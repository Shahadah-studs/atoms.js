<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atoms.js — Reactive UI + 3D Engine</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>⚛️ Atoms.js</h1>
    <p>Reactive state + shaded 3D WebGL scenes in under 200 lines of zero-dependency JS.</p>
  </header>

  <main id="app"></main>

  <script type="module">
    import { atom, h, mount, Scene3D, SphereGeometry, TorusGeometry } from './atoms.js';

    function App() {
      const time = atom(0);
      const speed = atom(1.0);
      const nucleusScale = atom(1.0);
      const themeIndex = atom(0);

      const themes = [
        { name: 'Quantum Blue', core: [0.22, 0.65, 1.0], ring: [0.55, 0.85, 1.0] },
        { name: 'Plasma Gold',  core: [1.0, 0.65, 0.15], ring: [1.0, 0.88, 0.45] },
        { name: 'Neon Emerald', core: [0.15, 0.85, 0.55], ring: [0.5, 1.0, 0.8] }
      ];

      function animate() {
        time.value += 0.025 * speed.value;
        requestAnimationFrame(animate);
      }
      requestAnimationFrame(animate);

      const nucleus = SphereGeometry(0.45, 32);
      const orbitRing = TorusGeometry(1.35, 0.032, 16, 72);

      return h('div', { class: 'card' },
        h('h2', {}, 'Interactive 3D Atom (Drag to Orbit)'),
        Scene3D({
          width: 600,
          height: 380,
          meshes: [
            // Glowing Nucleus
            {
              geometry: nucleus,
              scale: () => nucleusScale.value + Math.sin(time.value * 3) * 0.04,
              color: () => themes[themeIndex.value].core
            },
            // Three Tilted Electron Rings
            {
              geometry: orbitRing,
              rotation: () => [0.6, time.value, 0.4],
              color: () => themes[themeIndex.value].ring
            },
            {
              geometry: orbitRing,
              rotation: () => [-0.6, time.value * 1.2, -0.4],
              color: () => themes[themeIndex.value].ring
            },
            {
              geometry: orbitRing,
              rotation: () => [1.4, 0.3, time.value * 0.9],
              color: () => themes[themeIndex.value].ring
            }
          ]
        }),
        h('div', { class: 'controls' },
          h('p', {}, () => `Orbit Speed: ${speed.value.toFixed(1)}x | Nucleus Scale: ${nucleusScale.value.toFixed(1)}`),
          h('button', { onclick: () => speed.value = speed.value > 0 ? 0 : 1.0 },
            () => speed.value > 0 ? 'Pause Orbit' : 'Resume Orbit'
          ),
          h('button', { onclick: () => speed.value = +(speed.value + 0.5).toFixed(1) }, 'Speed +'),
          h('button', { onclick: () => nucleusScale.value = nucleusScale.value >= 1.4 ? 0.8 : +(nucleusScale.value + 0.2).toFixed(1) }, 'Resize Core'),
          h('button', { onclick: () => themeIndex.value = (themeIndex.value + 1) % themes.length },
            () => `Theme: ${themes[themeIndex.value].name}`
          )
        )
      );
    }

    mount(App, document.getElementById('app'));
  </script>
</body>
</html>
